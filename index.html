<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
    <title>Crack The Code</title>
</head>

<body>
    <header>
        <h1>Crack The Code</h1>
    </header>
    <div>
        <h6></h6>
    </div>
    <div id="menus">
        <label for="Hints">Choose the Hint mode</label>
        <select name="Hints" id="hint">
            <option value="easy">Easy</option>
            <option value="med">Med</option>
            <option value="hard">Hard</option>
        </select>
        <label for="guesses">Choose the amount of possible guesses</label>
        <select name="guesses" id="guesses">
            <option value="10">10 guesses</option>
            <option value="15">15 guesses</option>
            <option value="20">20 guesses</option>
            <option value="25">25 guesses</option>
        </select>
        <label for="length">Choose the length of Code you want to crack</label>
        <select name="length" id="codeLengthMenu">
            <option value="4">4 Digit</option>
            <option value="5">5 Digit</option>
            <option value="6">6 Digit</option>
        </select>
    </br>
        <button id="start">Let's Start</button>
    </div>
    <div id="board">
        <div id="guessing-section">
            <input type="text" name="guessing-field" id="guessing-field", placeholder="Enter your guess">
            <button id="check">Check</button>
        </div>
        <div id="prev-guesses-list">
            <h5>Previous Guesses and Hints</h5>
            <ul>

            </ul>
        </div>
    </div>



</body>

</html>
